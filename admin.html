<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gahremani Run — پنل مدیریت</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--pink:#ff2bd6;--cyan:#27e8ff;--violet:#8b5cf6;--bg:#0b0224}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(120% 70% at 50% 0%,#33106b,#0b0224 48%,#03000a);color:#fff;font-family:system-ui,sans-serif;padding:16px}
h1{font-size:19px;text-shadow:0 0 10px var(--pink)}
.card{background:#120828;border:1px solid #3a2a6a;border-radius:14px;padding:14px;margin-bottom:14px}
input,button,select{font:inherit;border-radius:10px;border:1.5px solid var(--cyan);background:#0a0626;color:#fff;padding:9px 12px}
button{cursor:pointer;background:linear-gradient(90deg,var(--pink),var(--violet));border:0;font-weight:800}
button.ghost{background:#0a0626;border:1.5px solid #8b5cf6aa}
button.danger{background:#5a0f1c;border:1.5px solid #ff4d6d}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid #ffffff14;text-align:right}
tr.flagged{background:#3a1a0a55}tr.blocked{background:#4a0a1655;opacity:.7}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800}
.pill.ok{background:#0d3b2e;color:#6dffb2}.pill.bad{background:#4a0a16;color:#ff8da1}
#hidden{display:none}
</style></head>
<body>
<div id="login" class="card" style="max-width:360px;margin:60px auto">
  <h1>🔐 ورود مدیر</h1>
  <div class="row" style="flex-direction:column;align-items:stretch">
    <input id="lu" placeholder="نام کاربری">
    <input id="lp" type="password" placeholder="رمز عبور">
    <button id="loginBtn">ورود</button>
    <div id="loginErr" style="color:#ff8da1;font-size:13px"></div>
  </div>
</div>

<div id="panel" style="display:none">
  <h1>🛡️ پنل مدیریت Gahremani Run <button class="ghost" id="logoutBtn" style="float:left">خروج</button></h1>

  <div class="card">
    <div class="row">
      <input id="search" placeholder="جستجوی نام کاربری">
      <button id="searchBtn">جستجو</button>
      <button class="ghost" id="refreshBtn">تازه‌سازی</button>
      <span style="flex:1"></span>
      <button class="ghost" id="suspectsBtn">🚩 موارد مشکوک</button>
    </div>
  </div>

  <div class="card" id="suspectsCard" style="display:none">
    <h3>🚩 موارد مشکوک (بررسی‌نشده)</h3>
    <div id="suspectsList"></div>
  </div>

  <div class="card">
    <h3>بازیکنان</h3>
    <table><thead><tr><th>نام</th><th>سکه</th><th>الماس</th><th>اسکین‌ها</th><th>وضعیت</th><th>آخرین فعالیت</th><th></th></tr></thead>
    <tbody id="playerRows"></tbody></table>
  </div>

  <div class="card" id="detailCard" style="display:none">
    <div class="row"><h3 id="detailName" style="flex:1"></h3><button class="ghost" id="closeDetail">بستن</button></div>
    <div class="row">
      <button id="flagBtn" class="ghost">🚩 علامت‌گذاری</button>
      <button id="blockBtn" class="danger">⛔ مسدود کردن</button>
      <button id="unblockBtn" class="ghost">✅ رفع مسدودی</button>
    </div>
    <div class="row" style="margin-top:10px">
      <select id="adjCur"><option value="wallet">سکه</option><option value="diamonds">الماس</option></select>
      <input id="adjAmt" type="number" placeholder="مقدار (+/-)" style="width:120px">
      <input id="adjReason" placeholder="دلیل (الزامی)" style="flex:1;min-width:160px">
      <button id="adjBtn">اعمال اصلاح</button>
    </div>
    <h4>تراکنش‌ها</h4><div id="txList" style="max-height:220px;overflow-y:auto;font-size:12px"></div>
    <h4>موارد مشکوک این بازیکن</h4><div id="suspectDetail" style="font-size:12px"></div>
    <h4>دستگاه‌های مشترک (احتمالی)</h4><div id="deviceList" style="font-size:12px"></div>
  </div>
</div>

<script>
const CLOUD_URL='https://rjvjgxwfunafqwpnzwne.supabase.co';
const CLOUD_KEY='sb_publishable_u_SupvLT_Ls43HyCJlf5dQ_G9AyF0kC';
const AUTH_DOMAIN='@players.gahremani.local';
const sb=window.supabase.createClient(CLOUD_URL,CLOUD_KEY);
const $=id=>document.getElementById(id);
const fa=n=>Math.floor(Number(n)||0).toLocaleString('fa-IR');
async function rpc(name,payload){const {data,error}=await sb.rpc(name,payload||{});if(error)throw error;return data;}

async function checkAdmin(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return false;
  try{return await rpc('gahremani_is_admin',{});}catch(e){return false;}
}
async function doLogin(){
  $('loginErr').textContent='';
  const u=$('lu').value.trim(), p=$('lp').value;
  const email=u.toLowerCase().replace(/[^a-z0-9_.-]/g,'')+AUTH_DOMAIN;
  const {error}=await sb.auth.signInWithPassword({email,password:p});
  if(error){$('loginErr').textContent='ورود ناموفق: نام کاربری یا رمز اشتباه است';return;}
  if(!(await checkAdmin())){$('loginErr').textContent='این حساب مدیر نیست';await sb.auth.signOut();return;}
  $('login').style.display='none';$('panel').style.display='block';loadPlayers();
}
$('loginBtn').onclick=doLogin;$('lp').onkeydown=e=>{if(e.key==='Enter')doLogin();};
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload();};

async function loadPlayers(q){
  const rows=await rpc('gahremani_admin_list_players',{p_search:q||null,p_limit:150});
  $('playerRows').innerHTML=rows.map(r=>`<tr class="${r.blocked?'blocked':r.flagged?'flagged':''}">
    <td>${esc(r.username)}</td><td>${fa(r.wallet)}</td><td>${fa(r.diamonds)}</td><td>${fa(r.skin_count)}</td>
    <td>${r.blocked?'<span class="pill bad">مسدود</span>':r.flagged?'<span class="pill bad">علامت‌دار</span>':'<span class="pill ok">عادی</span>'}</td>
    <td>${new Date(r.updated_at).toLocaleString('fa-IR')}</td>
    <td><button class="ghost" data-owner="${r.owner_hash}" data-name="${esc(r.username)}">جزئیات</button></td></tr>`).join('')||'<tr><td colspan="7">چیزی پیدا نشد</td></tr>';
  document.querySelectorAll('[data-owner]').forEach(b=>b.onclick=()=>openDetail(b.dataset.owner,b.dataset.name));
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
$('searchBtn').onclick=()=>loadPlayers($('search').value);
$('refreshBtn').onclick=()=>loadPlayers($('search').value);

let curOwner=null;
async function openDetail(owner,name){
  curOwner=owner;$('detailCard').style.display='block';$('detailName').textContent='👤 '+name;
  const d=await rpc('gahremani_admin_player_detail',{p_owner_hash:owner});
  $('txList').innerHTML=(d.transactions||[]).map(t=>`<div>${new Date(t.created_at).toLocaleString('fa-IR')} — ${esc(t.kind)} ${t.amount>0?'+':''}${fa(t.amount)} ${t.currency} (${esc(t.reason)})</div>`).join('')||'بدون تراکنش';
  $('suspectDetail').innerHTML=(d.suspects||[]).map(s=>`<div>${new Date(s.created_at).toLocaleString('fa-IR')} — ${esc(s.reason)} ${s.reviewed?'✅':'🚩'}</div>`).join('')||'موردی ثبت نشده';
  $('deviceList').innerHTML='در حال بارگذاری...';
  try{const sh=await rpc('gahremani_admin_shared_devices',{p_owner_hash:owner});
    $('deviceList').innerHTML=sh.length?sh.map(x=>`<div>⚠️ احتمالاً همان فرد: ${esc(x.username||'(بی‌نام)')}</div>`).join(''):'موردی پیدا نشد (این سیگنال قابل‌اطمینان کامل نیست)';
  }catch(e){$('deviceList').textContent='خطا در دریافت';}
}
$('closeDetail').onclick=()=>{$('detailCard').style.display='none';curOwner=null;};
$('flagBtn').onclick=async()=>{if(!curOwner)return;await rpc('gahremani_admin_set_flag',{p_owner_hash:curOwner,p_flagged:true,p_note:'manual flag'});loadPlayers($('search').value);};
$('blockBtn').onclick=async()=>{if(!curOwner)return;if(!confirm('این بازیکن مسدود شود؟'))return;await rpc('gahremani_admin_set_block',{p_owner_hash:curOwner,p_blocked:true,p_note:'manual block'});loadPlayers($('search').value);};
$('unblockBtn').onclick=async()=>{if(!curOwner)return;await rpc('gahremani_admin_set_block',{p_owner_hash:curOwner,p_blocked:false});loadPlayers($('search').value);};
$('adjBtn').onclick=async()=>{
  if(!curOwner)return;
  const cur=$('adjCur').value,amt=parseInt($('adjAmt').value,10),reason=$('adjReason').value.trim();
  if(!amt||!reason){alert('مقدار و دلیل را پر کن');return;}
  const r=await rpc('gahremani_admin_adjust_balance',{p_owner_hash:curOwner,p_currency:cur,p_amount:amt,p_reason:reason});
  if(r?.ok){alert('اعمال شد');openDetail(curOwner,$('detailName').textContent.replace('👤 ',''));loadPlayers($('search').value);}
  else alert('خطا: '+(r?.reason||'نامشخص'));
};
$('suspectsBtn').onclick=async()=>{
  const c=$('suspectsCard');c.style.display=c.style.display==='none'?'block':'none';
  if(c.style.display==='block'){
    const rows=await rpc('gahremani_admin_list_suspects',{p_only_unreviewed:true});
    $('suspectsList').innerHTML=rows.map(s=>`<div class="row" style="border-bottom:1px solid #ffffff14;padding:6px 0">
      <span style="flex:1">${new Date(s.created_at).toLocaleString('fa-IR')} — ${esc(s.username||'?')} — ${esc(s.reason)}</span>
      <button class="ghost" data-view="${s.owner_hash}" data-name="${esc(s.username||'?')}">دیدن</button>
      <button class="ghost" data-rev="${s.id}">بررسی شد</button></div>`).join('')||'موردی نیست';
    document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>openDetail(b.dataset.view,b.dataset.name));
    document.querySelectorAll('[data-rev]').forEach(b=>b.onclick=async()=>{await rpc('gahremani_admin_mark_reviewed',{p_id:+b.dataset.rev});$('suspectsBtn').click();$('suspectsBtn').click();});
  }
};
(async()=>{ if(await checkAdmin()){$('login').style.display='none';$('panel').style.display='block';loadPlayers();} })();
</script>
</body></html>
